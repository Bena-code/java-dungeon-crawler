version: '3.8'
services:
  serveur-java:
    image: eclipse-temurin:17-jre
    volumes:
      - ./target/ExploGame-jar-with-dependencies.jar:/app/serveur.jar
    command: java -jar /app/serveur.jar
    ports:
      - "5555:5555" # Ouvre le port réseau

  client-python:
    image: python:3.11-slim
    volumes:
      - ./client.py:/app/client.py
    command: python /app/client.py
    depends_on:
      - serveur-java
    stdin_open: true  # Permet de garder la console ouverte pour jouer
    tty: true